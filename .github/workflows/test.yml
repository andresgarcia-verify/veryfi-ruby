name: Test

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby_version: [2.7, 3.0, 3.1, 3.2, 3.3, 3.4]
    env:
      CI: true
    steps:
      - uses: actions/checkout@v2
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby_version }}
          # runs 'bundle install' and caches installed gems automatically
          bundler-cache: true
      - name: Run CI scripts
        run: bin/ci
